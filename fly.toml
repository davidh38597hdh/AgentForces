# Fly.io — secondary production target (Docker). Primary remains Vercel.
# Setup:
#   fly auth login
#   fly launch --no-deploy   # or: fly apps create agentxforces
#   fly secrets set AUTH_SECRET=... AUTH_URL=https://YOURAPP.fly.dev AUTH_TRUST_HOST=true ...
#   fly deploy

app = "agentxforces"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "3000"
  HOSTNAME = "0.0.0.0"
  AUTH_TRUST_HOST = "true"
  DEPLOY_TARGET = "fly"
  NEXT_TELEMETRY_DISABLED = "1"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

  [[http_service.checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "20s"
    method = "GET"
    path = "/api/health"

[[vm]]
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1
