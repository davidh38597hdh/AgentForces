# Render.com — alternate secondary Docker deploy
# https://render.com/docs/blueprint-spec
# Dashboard: New → Blueprint → connect this repo

services:
  - type: web
    name: agentxforces
    runtime: docker
    plan: starter
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    envVars:
      - key: DEPLOY_TARGET
        value: render
      - key: AUTH_TRUST_HOST
        value: "true"
      - key: PORT
        value: "3000"
      - key: HOSTNAME
        value: "0.0.0.0"
      - key: AUTH_SECRET
        generateValue: true
      - key: AUTH_URL
        sync: false
      - key: NEXT_PUBLIC_APP_URL
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: XAI_API_KEY
        sync: false
